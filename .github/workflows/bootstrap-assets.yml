name: Restore project artwork
on:
  push:
    paths: ['.github/workflows/bootstrap-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore the reviewed project images
        env:
          EXPECTED_SHA256: 4bb91ff78cab05a6615ca8b041f1f06f6e0599acbfcd1b1fa7c4f29c3e388287
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64, hashlib, io, os, zipfile
          parts = sorted(Path('.').glob('asset-bundle.part*.b64'))
          assert len(parts) == 9, 'Incomplete image package'
          data = base64.b64decode(''.join(p.read_text() for p in parts))
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256'], 'Image package integrity check failed'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  assert name.startswith('assets/') and '..' not in Path(name).parts
              archive.extractall('.')
          for part in parts:
              part.unlink()
          Path('.github/workflows/bootstrap-assets.yml').unlink()
          PYTHON
      - name: Commit project artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add reviewed project artwork and remove one-time transfer files'
          git push
