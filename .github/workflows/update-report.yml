name: Update report and project figures
on:
  push:
    paths: ['.github/workflows/update-report.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore reviewed report and website files
        env:
          EXPECTED_SHA256: 1c0f98e3b1da4e0cf0ac448c467414c98deeb74cf87b02d5ba7a798f1ebdd204
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64, hashlib, io, os, zipfile
          parts = sorted(Path('.').glob('report-update.part*.b64'))
          assert len(parts) == 34, 'Incomplete project update'
          data = base64.b64decode(''.join(p.read_text() for p in parts))
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256'], 'Update integrity check failed'
          allowed = {'index.html', 'styles.css', 'app.js', 'README.md', 'WEBSITE.md', 'scripts/prepare-assets.py'}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                  assert (name in allowed or name.startswith('assets/')) and '..' not in Path(name).parts
              archive.extractall('.')
          for part in parts:
              part.unlink()
          Path('.github/workflows/update-report.yml').unlink()
          PYTHON
      - name: Commit updated report and figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh technical report, README badges and all figures from latest Overleaf PDF'
          git push
      - uses: actions/configure-pages@v5
      - name: Prepare static project page
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy updated project page
        id: deployment
        uses: actions/deploy-pages@v4
