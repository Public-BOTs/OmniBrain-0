name: Refresh project page design
on:
  push:
    paths: ['.github/workflows/refresh-design.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply the reviewed design update
        env:
          EXPECTED_SHA256: 635b0b4e360dc5a43955aaee7b1bf75b6d7de5b9fb4bae7d6f4333e27f38649c
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64, hashlib, io, os, zipfile
          payload = Path('design-refresh.payload.b64')
          data = base64.b64decode(payload.read_text())
          assert hashlib.sha256(data).hexdigest() == os.environ['EXPECTED_SHA256'], 'Design update integrity check failed'
          allowed = {'index.html', 'styles.css', 'app.js', 'WEBSITE.md', 'assets/hero-unified-brain.webp'}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert set(archive.namelist()) == allowed, 'Unexpected update contents'
              archive.extractall('.')
          payload.unlink()
          Path('.github/workflows/refresh-design.yml').unlink()
          PYTHON
      - name: Commit the project page redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Redesign project page with unified-brain artwork and refined layouts'
          git push
      - uses: actions/configure-pages@v5
      - name: Prepare static project page
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy the new design
        id: deployment
        uses: actions/deploy-pages@v4
